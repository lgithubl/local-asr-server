name: Build Image

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag
        required: false
        default: m40
      export_artifact:
        description: Export image tar.gz artifact
        required: false
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        shell: bash
        run: |
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/local-asr-server:${{ inputs.tag }}"
          echo "image=${IMAGE,,}" >> "$GITHUB_OUTPUT"
          echo "artifact_name=local-asr-server-${{ inputs.tag }}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.image.outputs.image }}

      - name: Smoke test runtime contract
        shell: bash
        run: |
          set -euxo pipefail
          docker pull "${{ steps.image.outputs.image }}"
          docker image inspect "${{ steps.image.outputs.image }}" \
            --format '{{ index .Config.Labels "ai.lgithubl.m40.expected_compute_capability" }}' \
            | grep -qx "5.2"
          docker image inspect "${{ steps.image.outputs.image }}" \
            --format '{{ index .Config.Labels "ai.lgithubl.ctranslate2.version" }}' \
            | grep -qx "3.24.0"
          docker run --rm --entrypoint python3 "${{ steps.image.outputs.image }}" - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("ctranslate2") == "3.24.0"
          assert importlib.metadata.version("faster-whisper") == "0.10.1"
          print("ctranslate2", importlib.metadata.version("ctranslate2"))
          PY

      - name: Write image summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Docker image

          Published image:

          \`\`\`text
          ${{ steps.image.outputs.image }}
          \`\`\`

          Pull it with:

          \`\`\`bash
          docker pull ${{ steps.image.outputs.image }}
          \`\`\`
          EOF

      - name: Export image tarball
        if: inputs.export_artifact == 'true'
        shell: bash
        run: |
          docker pull "${{ steps.image.outputs.image }}"
          docker save "${{ steps.image.outputs.image }}" | gzip > "${{ steps.image.outputs.artifact_name }}.tar.gz"

      - name: Upload image artifact
        if: inputs.export_artifact == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.image.outputs.artifact_name }}
          path: ${{ steps.image.outputs.artifact_name }}.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Write local image artifact summary
        if: inputs.export_artifact == 'true'
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Local Docker image artifact

          Download the artifact named \`${{ steps.image.outputs.artifact_name }}\` from this workflow run.

          Load it locally with:

          \`\`\`bash
          gzip -dc ${{ steps.image.outputs.artifact_name }}.tar.gz | docker load
          docker image inspect ${{ steps.image.outputs.image }}
          \`\`\`
          EOF
