name: Build Model Pack

on:
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Name of the uploaded model artifact
        required: true
        default: asr-model-ja-kotoba
      model_id:
        description: Hugging Face model id to download
        required: true
        default: kotoba-tech/kotoba-whisper-v2.0-faster
      revision:
        description: Optional Hugging Face revision
        required: false
        default: main

permissions:
  contents: read

jobs:
  build-model-pack:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Install tools
        run: |
          python3 -m pip install --user --upgrade huggingface_hub
          sudo apt-get update
          sudo apt-get install -y zstd

      - name: Download model
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/model"
          python3 - <<'PY'
          import os
          import shutil
          from pathlib import Path

          from huggingface_hub import snapshot_download

          snapshot_path = snapshot_download(
              repo_id="${{ inputs.model_id }}",
              revision="${{ inputs.revision }}",
          )
          destination = Path(os.environ["RUNNER_TEMP"]) / "model"
          for child in Path(snapshot_path).iterdir():
              target = destination / child.name
              if child.is_dir():
                  shutil.copytree(child, target, symlinks=False, dirs_exist_ok=True)
              else:
                  shutil.copy2(child, target, follow_symlinks=True)
          PY
          find "$RUNNER_TEMP/model" -maxdepth 2 -type f | sort | sed -n '1,120p'
          test -f "$RUNNER_TEMP/model/model.bin"
          du -sh "$RUNNER_TEMP/model"

      - name: Pack model artifact
        shell: bash
        run: |
          set -euxo pipefail
          tar -C "$RUNNER_TEMP/model" -I 'zstd -3 -T0' -cf "${{ inputs.artifact_name }}.tar.zst" .
          ls -lh "${{ inputs.artifact_name }}.tar.zst"

      - name: Upload model artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}
          path: ${{ inputs.artifact_name }}.tar.zst
          if-no-files-found: error
          retention-days: 30

      - name: Prepare runtime package
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "${{ inputs.artifact_name }}-runtime/models" "${{ inputs.artifact_name }}-runtime/inputs" "${{ inputs.artifact_name }}-runtime/outputs"
          cp -a "$RUNNER_TEMP/model/." "${{ inputs.artifact_name }}-runtime/models/"
          cat > "${{ inputs.artifact_name }}-runtime/docker.env" <<'EOF'
          ASR_BACKEND=faster-whisper
          ASR_MODEL_PATH=/models
          ASR_DEVICE=cuda
          ASR_COMPUTE_TYPE=int8_float16
          ASR_DEFAULT_LANGUAGE=ja
          ASR_INPUT_DIR=/inputs
          ASR_OUTPUT_DIR=/outputs
          EOF
          cat > "${{ inputs.artifact_name }}-runtime/run-docker.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail

          IMAGE="${1:-ghcr.io/lgithubl/local-asr-server:m40}"
          PORT="${PORT:-8910}"
          NAME="${NAME:-local-asr-server-ja}"
          ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"

          docker run -d \
            --name "$NAME" \
            --restart unless-stopped \
            --gpus all \
            -p "$PORT:8080" \
            --env-file "$ROOT/docker.env" \
            -v "$ROOT/inputs:/inputs:ro" \
            -v "$ROOT/outputs:/outputs" \
            -v "$ROOT/models:/models:ro" \
            "$IMAGE"
          EOF
          chmod +x "${{ inputs.artifact_name }}-runtime/run-docker.sh"
          cat > "${{ inputs.artifact_name }}-runtime/README.md" <<'EOF'
          # local-asr-server Japanese runtime package

          This artifact is ready to mount into `ghcr.io/lgithubl/local-asr-server:m40`.

          ## Start

          ```bash
          ./run-docker.sh
          ```

          Put audio files under `inputs/`, then call:

          ```bash
          curl -X POST http://127.0.0.1:8910/v1/subtitles \
            -H 'Content-Type: application/json' \
            -d '{"input_path":"/inputs/demo.wav","language":"ja","output_format":"srt","uniq_key_name":"demo-ja.srt"}'
          ```

          Finished subtitles are written to `outputs/`. The service writes `.tmp` first and then atomically renames to the final `uniq_key_name`.
          EOF
          find "${{ inputs.artifact_name }}-runtime" -maxdepth 2 -type f | sort | sed -n '1,160p'
          du -sh "${{ inputs.artifact_name }}-runtime"

      - name: Upload runtime package
        uses: actions/upload-artifact@v6
        with:
          name: ${{ inputs.artifact_name }}-runtime
          path: ${{ inputs.artifact_name }}-runtime
          if-no-files-found: error
          retention-days: 30

      - name: Write model summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<EOF
          ## Model artifact

          Artifact: \`${{ inputs.artifact_name }}\`

          Model source: \`${{ inputs.model_id }}\` @ \`${{ inputs.revision }}\`

          Unpack on host:

          \`\`\`bash
          mkdir -p /data/asr-models/${{ inputs.artifact_name }}
          tar -C /data/asr-models/${{ inputs.artifact_name }} -I zstd -xf ${{ inputs.artifact_name }}.tar.zst
          \`\`\`
          EOF
