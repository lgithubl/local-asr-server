name: Interactive HTTP

on:
  workflow_dispatch:
    inputs:
      image_source:
        description: Load image from artifact or pull from registry
        required: true
        default: artifact
        type: choice
        options:
          - artifact
          - registry
      image:
        description: Docker image to run
        required: true
        default: ghcr.io/lgithubl/local-asr-server:m40
      image_artifact:
        description: Image tar.gz artifact name from Build Image
        required: true
        default: local-asr-server-m40
      image_run_id:
        description: Optional Build Image run id. Empty means latest successful run.
        required: false
        default: ""
      backend:
        description: Backend to run. mock starts fast; faster-whisper uses model artifact.
        required: true
        default: mock
        type: choice
        options:
          - mock
          - faster-whisper
      model_artifact:
        description: Model artifact name from Build Model Pack when backend=faster-whisper
        required: false
        default: asr-model-ja-kotoba
      model_run_id:
        description: Optional Build Model Pack run id. Empty means latest successful run.
        required: false
        default: ""
      asmr_vad_artifact:
        description: Optional ASMR VAD artifact name from Build ASMR VAD Pack
        required: false
        default: ""
      asmr_vad_run_id:
        description: Optional Build ASMR VAD Pack run id. Empty means latest successful run when artifact is set.
        required: false
        default: ""
      minutes:
        description: Minutes to keep endpoint alive
        required: false
        default: "60"
      idle_unload_seconds:
        description: ASR_IDLE_UNLOAD_SECONDS for the test server. 0 disables.
        required: false
        default: "0"
      code_artifact:
        description: Optional mountable code artifact name from Build Image, e.g. local-asr-server-code-m40
        required: false
        default: ""
      code_run_id:
        description: Optional Build Image run id for code artifact. Empty reuses image_run_id/latest Build Image.
        required: false
        default: ""

permissions:
  contents: read
  packages: read
  actions: read

jobs:
  interactive:
    name: Start temporary ASR HTTP endpoint
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Login to GitHub Container Registry
        if: ${{ inputs.image_source == 'registry' && startsWith(inputs.image, 'ghcr.io/') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        if: ${{ inputs.image_source == 'registry' }}
        run: docker pull "${{ inputs.image }}"

      - name: Resolve image artifact run
        if: ${{ inputs.image_source == 'artifact' }}
        id: image-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          RUN_ID="${{ inputs.image_run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "Build Image" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Build Image run found." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download and load image artifact
        if: ${{ inputs.image_source == 'artifact' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/asr-image-artifact"
          gh run download "${{ steps.image-run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.image_artifact }}" \
            --dir "$RUNNER_TEMP/asr-image-artifact"
          find "$RUNNER_TEMP/asr-image-artifact" -type f -name '*.tar.gz' -print -quit \
            | xargs -r -I{} sh -c 'gzip -dc "$1" | docker load' sh {}
          docker image inspect "${{ inputs.image }}" >/dev/null

      - name: Resolve model artifact run
        if: ${{ inputs.backend == 'faster-whisper' }}
        id: model-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          RUN_ID="${{ inputs.model_run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "Build Model Pack" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Build Model Pack run found." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download model artifact
        if: ${{ inputs.backend == 'faster-whisper' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd
          mkdir -p "$RUNNER_TEMP/asr-model-artifact" "$RUNNER_TEMP/asr-models"
          gh run download "${{ steps.model-run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.model_artifact }}" \
            --dir "$RUNNER_TEMP/asr-model-artifact"
          find "$RUNNER_TEMP/asr-model-artifact" -type f -name '*.tar.zst' -print -quit \
            | xargs -r -I{} tar -C "$RUNNER_TEMP/asr-models" -I zstd -xf {}
          du -sh "$RUNNER_TEMP/asr-models"

      - name: Resolve ASMR VAD artifact run
        if: ${{ inputs.asmr_vad_artifact != '' }}
        id: asmr-vad-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          RUN_ID="${{ inputs.asmr_vad_run_id }}"
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "Build ASMR VAD Pack" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Build ASMR VAD Pack run found." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download ASMR VAD artifact
        if: ${{ inputs.asmr_vad_artifact != '' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/asr-asmr-vad"
          gh run download "${{ steps.asmr-vad-run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.asmr_vad_artifact }}" \
            --dir "$RUNNER_TEMP/asr-asmr-vad"
          test -f "$RUNNER_TEMP/asr-asmr-vad/model.onnx"
          test -f "$RUNNER_TEMP/asr-asmr-vad/model_metadata.json"
          test -f "$RUNNER_TEMP/asr-asmr-vad/preprocessor_config.json"
          du -sh "$RUNNER_TEMP/asr-asmr-vad"

      - name: Resolve code artifact run
        if: ${{ inputs.code_artifact != '' }}
        id: code-run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          RUN_ID="${{ inputs.code_run_id }}"
          if [ -z "$RUN_ID" ] && [ "${{ inputs.image_source }}" = "artifact" ]; then
            RUN_ID="${{ steps.image-run.outputs.run_id }}"
          fi
          if [ -z "$RUN_ID" ]; then
            RUN_ID="$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow "Build Image" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId')"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "No successful Build Image run found for code artifact." >&2
            exit 1
          fi
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      - name: Download code artifact
        if: ${{ inputs.code_artifact != '' }}
        id: code-dir
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$RUNNER_TEMP/asr-code-artifact" "$RUNNER_TEMP/asr-code"
          gh run download "${{ steps.code-run.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name "${{ inputs.code_artifact }}" \
            --dir "$RUNNER_TEMP/asr-code-artifact"
          find "$RUNNER_TEMP/asr-code-artifact" -type f -name '*.tar.gz' -print -quit \
            | xargs -r -I{} tar -C "$RUNNER_TEMP/asr-code" -xzf {}
          CODE_DIR="$(find "$RUNNER_TEMP/asr-code" -mindepth 1 -maxdepth 1 -type d -print -quit)"
          test -f "$CODE_DIR/asr_server/main.py"
          echo "path=$CODE_DIR" >> "$GITHUB_OUTPUT"
          du -sh "$CODE_DIR"

      - name: Prepare volumes
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/asr-inputs" "$RUNNER_TEMP/asr-outputs" "$RUNNER_TEMP/asr-models" "$RUNNER_TEMP/asr-asmr-vad"
          python3 - <<'PY'
          import math
          import os
          import struct
          import wave
          from pathlib import Path

          path = Path(os.environ["RUNNER_TEMP"]) / "asr-inputs" / "sample.wav"
          sample_rate = 16000
          duration = 1.0
          with wave.open(str(path), "wb") as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(sample_rate)
              for i in range(int(sample_rate * duration)):
                  value = int(1200 * math.sin(2 * math.pi * 440 * i / sample_rate))
                  wav.writeframes(struct.pack("<h", value))
          PY

      - name: Start ASR server
        shell: bash
        run: |
          CODE_MOUNT_ARGS=()
          if [ -n "${{ inputs.code_artifact }}" ]; then
            CODE_MOUNT_ARGS=(
              -v "${{ steps.code-dir.outputs.path }}:/workspace/local-asr-server:ro"
              -e ASR_REQUIRE_EXTERNAL_CODE=1
            )
          fi
          docker run -d --name local-asr-server \
            -p 9000:9000 \
            -v "$RUNNER_TEMP/asr-inputs:/inputs:ro" \
            -v "$RUNNER_TEMP/asr-outputs:/outputs" \
            -v "$RUNNER_TEMP/asr-models:/models:ro" \
            -v "$RUNNER_TEMP/asr-asmr-vad:/asmr-vad:ro" \
            "${CODE_MOUNT_ARGS[@]}" \
            -e ASR_BACKEND="${{ inputs.backend }}" \
            -e ASR_MODEL_PATH=/models \
            -e ASR_DEVICE=cpu \
            -e ASR_COMPUTE_TYPE=int8 \
            -e ASR_DEFAULT_LANGUAGE=ja \
            -e ASR_IDLE_UNLOAD_SECONDS="${{ inputs.idle_unload_seconds }}" \
            -e ASR_ASMR_VAD_MODEL_PATH=/asmr-vad/model.onnx \
            -e ASR_ASMR_VAD_METADATA_PATH=/asmr-vad/model_metadata.json \
            -e ASR_ASMR_VAD_FEATURE_EXTRACTOR_PATH=/asmr-vad \
            "${{ inputs.image }}"

      - name: Wait for server
        shell: bash
        run: |
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/health | tee "$RUNNER_TEMP/asr-health.json" | grep -q '"ok":true'; then
              exit 0
            fi
            docker logs --tail 80 local-asr-server || true
            sleep 2
          done
          docker logs local-asr-server || true
          exit 1

      - name: Smoke test subtitles and queue
        shell: bash
        run: |
          curl -fsS -X POST http://127.0.0.1:9000/v1/subtitles \
            -H 'Content-Type: application/json' \
            -d '{"input_path":"/inputs/sample.wav","language":"ja","output_format":"srt","uniq_key_name":"sample-ja.srt","vad_filter":true}' \
            | tee "$RUNNER_TEMP/asr-response.json"
          test -s "$RUNNER_TEMP/asr-outputs/sample-ja.srt"
          test ! -e "$RUNNER_TEMP/asr-outputs/sample-ja.srt.tmp"
          curl -fsS -X POST http://127.0.0.1:9000/v1/subtitles \
            -H 'Content-Type: application/json' \
            -d '{"input_path":"/inputs/sample.wav","language":"ja","output_format":"srt","uniq_key_name":"sample-ja-async.srt","vad_filter":false,"async":true}' \
            | tee "$RUNNER_TEMP/asr-async-response.json" | grep -q '"accepted":true'
          curl -fsS http://127.0.0.1:9000/v1/jobs | tee "$RUNNER_TEMP/asr-jobs.json"
          for i in $(seq 1 60); do
            if [ -s "$RUNNER_TEMP/asr-outputs/sample-ja-async.srt" ]; then
              break
            fi
            curl -fsS http://127.0.0.1:9000/v1/jobs | tee "$RUNNER_TEMP/asr-jobs.json"
            sleep 1
          done
          test -s "$RUNNER_TEMP/asr-outputs/sample-ja-async.srt"
          test ! -e "$RUNNER_TEMP/asr-outputs/sample-ja-async.srt.tmp"
          curl -fsS http://127.0.0.1:9000/v1/jobs | tee "$RUNNER_TEMP/asr-jobs-final.json" | grep -q '"pending_count":0'

      - name: Smoke test idle unload
        if: ${{ inputs.idle_unload_seconds != '0' }}
        shell: bash
        run: |
          sleep "$(( ${{ inputs.idle_unload_seconds }} + 3 ))"
          curl -fsS http://127.0.0.1:9000/health | tee "$RUNNER_TEMP/asr-health-after-idle.json" | grep -q '"model_loaded":false'

      - name: Smoke test ASMR VAD segmenter
        if: ${{ inputs.asmr_vad_artifact != '' && inputs.backend == 'faster-whisper' }}
        shell: bash
        run: |
          curl -fsS -X POST http://127.0.0.1:9000/v1/subtitles \
            -H 'Content-Type: application/json' \
            -d '{"input_path":"/inputs/sample.wav","language":"ja","output_format":"srt","uniq_key_name":"sample-ja-asmr.srt","asmr_vad":true,"async":true}' \
            | tee "$RUNNER_TEMP/asr-asmr-response.json" | grep -q '"accepted":true'
          for i in $(seq 1 90); do
            if [ -e "$RUNNER_TEMP/asr-outputs/sample-ja-asmr.srt" ] || [ -e "$RUNNER_TEMP/asr-outputs/sample-ja-asmr.srt.err.log" ]; then
              exit 0
            fi
            curl -fsS http://127.0.0.1:9000/v1/jobs | tee "$RUNNER_TEMP/asr-jobs-asmr.json"
            sleep 2
          done
          docker logs local-asr-server || true
          exit 1

      - name: Start authenticated proxy
        id: auth
        shell: bash
        run: |
          USERNAME="asr"
          PASSWORD="$(openssl rand -base64 18 | tr -d '=+/')"
          {
            echo "username=$USERNAME"
            echo "password=$PASSWORD"
          } >> "$GITHUB_OUTPUT"
          cat >/tmp/basic_proxy.py <<'PY'
          import base64
          import http.server
          import os
          import urllib.error
          import urllib.request

          TARGET = "http://127.0.0.1:9000"
          USERNAME = os.environ["BASIC_USER"]
          PASSWORD = os.environ["BASIC_PASS"]
          EXPECTED = "Basic " + base64.b64encode(f"{USERNAME}:{PASSWORD}".encode()).decode()
          HOP_BY_HOP = {"connection", "keep-alive", "proxy-authenticate", "proxy-authorization", "te", "trailers", "transfer-encoding", "upgrade"}

          class Proxy(http.server.BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def _unauthorized(self):
                  body = b"Authentication required\n"
                  self.send_response(401)
                  self.send_header("WWW-Authenticate", 'Basic realm="local-asr-server"')
                  self.send_header("Content-Type", "text/plain")
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  self.wfile.write(body)

              def _proxy(self):
                  if self.headers.get("Authorization") != EXPECTED:
                      self._unauthorized()
                      return
                  length = int(self.headers.get("Content-Length") or 0)
                  body = self.rfile.read(length) if length else None
                  headers = {k: v for k, v in self.headers.items() if k.lower() not in HOP_BY_HOP and k.lower() != "host"}
                  headers.pop("Authorization", None)
                  req = urllib.request.Request(TARGET + self.path, data=body, headers=headers, method=self.command)
                  try:
                      with urllib.request.urlopen(req, timeout=900) as resp:
                          payload = resp.read()
                          self.send_response(resp.status)
                          for k, v in resp.headers.items():
                              if k.lower() not in HOP_BY_HOP and k.lower() != "content-length":
                                  self.send_header(k, v)
                          self.send_header("Content-Length", str(len(payload)))
                          self.end_headers()
                          self.wfile.write(payload)
                  except urllib.error.HTTPError as exc:
                      payload = exc.read()
                      self.send_response(exc.code)
                      for k, v in exc.headers.items():
                          if k.lower() not in HOP_BY_HOP and k.lower() != "content-length":
                              self.send_header(k, v)
                      self.send_header("Content-Length", str(len(payload)))
                      self.end_headers()
                      self.wfile.write(payload)

              def do_GET(self): self._proxy()
              def do_HEAD(self): self._proxy()
              def do_POST(self): self._proxy()
              def do_PUT(self): self._proxy()
              def do_PATCH(self): self._proxy()
              def do_DELETE(self): self._proxy()

          http.server.ThreadingHTTPServer(("127.0.0.1", 9090), Proxy).serve_forever()
          PY
          BASIC_USER="$USERNAME" BASIC_PASS="$PASSWORD" python /tmp/basic_proxy.py >/tmp/basic_proxy.log 2>&1 &
          echo $! >/tmp/basic_proxy.pid
          sleep 1
          curl -fsS -u "$USERNAME:$PASSWORD" http://127.0.0.1:9090/health >/dev/null

      - name: Start Cloudflare quick tunnel
        id: tunnel
        shell: bash
        run: |
          curl -L https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -o /tmp/cloudflared
          chmod +x /tmp/cloudflared
          /tmp/cloudflared tunnel --url http://127.0.0.1:9090 --no-autoupdate >/tmp/cloudflared.log 2>&1 &
          echo $! >/tmp/cloudflared.pid
          for i in $(seq 1 60); do
            URL="$(grep -oE 'https://[-a-zA-Z0-9.]+\.trycloudflare\.com' /tmp/cloudflared.log | head -n 1 || true)"
            if [ -n "$URL" ]; then
              echo "url=$URL" >> "$GITHUB_OUTPUT"
              {
                echo "URL=$URL"
                echo "USERNAME=${{ steps.auth.outputs.username }}"
                echo "PASSWORD=${{ steps.auth.outputs.password }}"
                echo "BACKEND=${{ inputs.backend }}"
              } > "$RUNNER_TEMP/local-asr-server-connection-info.txt"
              echo "::notice title=Temporary URL::$URL"
              exit 0
            fi
            cat /tmp/cloudflared.log || true
            sleep 2
          done
          cat /tmp/cloudflared.log || true
          exit 1

      - name: Browser self-test through tunnel
        shell: bash
        run: |
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
          TUNNEL_URL="${{ steps.tunnel.outputs.url }}"
          TUNNEL_HOST="${TUNNEL_URL#https://}"
          AUTH_URL="https://${{ steps.auth.outputs.username }}:${{ steps.auth.outputs.password }}@$TUNNEL_HOST"
          npx playwright screenshot --wait-for-timeout=2000 "$AUTH_URL/" /tmp/local-asr-home.png
          curl -fsS -u "${{ steps.auth.outputs.username }}:${{ steps.auth.outputs.password }}" "${{ steps.tunnel.outputs.url }}/health" | tee /tmp/asr-tunnel-health.json

      - name: Upload connection info
        uses: actions/upload-artifact@v6
        with:
          name: local-asr-server-connection-info
          path: ${{ runner.temp }}/local-asr-server-connection-info.txt
          if-no-files-found: error
          retention-days: 1

      - name: Keep session alive
        run: |
          echo "${{ steps.tunnel.outputs.url }}"
          echo "Keeping session alive for ${{ inputs.minutes }} minutes..."
          sleep "$(( ${{ inputs.minutes }} * 60 ))"

      - name: Collect logs
        if: always()
        run: |
          docker logs local-asr-server >/tmp/local-asr-server.log 2>&1 || true
          cp "$RUNNER_TEMP/asr-health.json" /tmp/asr-health.json 2>/dev/null || true
          cp "$RUNNER_TEMP/asr-health-after-idle.json" /tmp/asr-health-after-idle.json 2>/dev/null || true
          cp "$RUNNER_TEMP/asr-response.json" /tmp/asr-response.json 2>/dev/null || true
          cp "$RUNNER_TEMP/asr-async-response.json" /tmp/asr-async-response.json 2>/dev/null || true
          cp "$RUNNER_TEMP/asr-asmr-response.json" /tmp/asr-asmr-response.json 2>/dev/null || true
          cp "$RUNNER_TEMP/asr-jobs.json" /tmp/asr-jobs.json 2>/dev/null || true
          cp "$RUNNER_TEMP/asr-jobs-final.json" /tmp/asr-jobs-final.json 2>/dev/null || true
          cp "$RUNNER_TEMP/asr-jobs-asmr.json" /tmp/asr-jobs-asmr.json 2>/dev/null || true
          cp "$RUNNER_TEMP/asr-outputs/sample-ja.srt" /tmp/sample-ja.srt 2>/dev/null || true
          cp "$RUNNER_TEMP/asr-outputs/sample-ja-async.srt" /tmp/sample-ja-async.srt 2>/dev/null || true
          cp "$RUNNER_TEMP/asr-outputs/sample-ja-asmr.srt" /tmp/sample-ja-asmr.srt 2>/dev/null || true
          cp "$RUNNER_TEMP/asr-outputs/sample-ja-asmr.srt.err.log" /tmp/sample-ja-asmr.srt.err.log 2>/dev/null || true
          cp /tmp/cloudflared.log /tmp/cloudflared.log.copy 2>/dev/null || true
          cp /tmp/basic_proxy.log /tmp/basic_proxy.log.copy 2>/dev/null || true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: local-asr-server-interactive-logs
          path: |
            /tmp/local-asr-server.log
            /tmp/asr-health.json
            /tmp/asr-health-after-idle.json
            /tmp/asr-response.json
            /tmp/asr-async-response.json
            /tmp/asr-asmr-response.json
            /tmp/asr-tunnel-health.json
            /tmp/asr-jobs.json
            /tmp/asr-jobs-final.json
            /tmp/asr-jobs-asmr.json
            /tmp/sample-ja.srt
            /tmp/sample-ja-async.srt
            /tmp/sample-ja-asmr.srt
            /tmp/sample-ja-asmr.srt.err.log
            /tmp/local-asr-home.png
            /tmp/cloudflared.log.copy
            /tmp/basic_proxy.log.copy
          if-no-files-found: warn
          retention-days: 3
